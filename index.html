<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ask AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F7F4EF;
  --surface: #FFFFFF;
  --ink: #1A1714;
  --ink-muted: #7A736A;
  --ink-faint: #C4BDB5;
  --accent: #2D5A3D;
  --accent-light: #EBF2ED;
  --border: #E2DAD0;
  --radius: 4px;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'DM Mono', monospace;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 48px 24px 80px;
}
.wrap { width: 100%; max-width: 640px; position: relative; z-index: 1; }
header { margin-bottom: 48px; animation: fadeUp 0.6s ease both; }
.eyebrow { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
h1 { font-family: 'Playfair Display', serif; font-size: clamp(36px, 6vw, 52px); line-height: 1.1; color: var(--ink); font-weight: 400; }
h1 em { font-style: italic; color: var(--accent); }
.tagline { margin-top: 12px; font-size: 11px; color: var(--ink-muted); letter-spacing: 0.05em; }
.input-section { animation: fadeUp 0.6s 0.1s ease both; }
.field-label { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 8px; display: block; }
.input-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; transition: border-color 0.2s; }
.input-wrap:focus-within { border-color: var(--accent); }
textarea { width: 100%; font-family: 'DM Mono', monospace; font-size: 14px; color: var(--ink); background: transparent; border: none; outline: none; resize: none; min-height: 80px; line-height: 1.7; }
textarea::placeholder { color: var(--ink-faint); }
.input-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.char-count { font-size: 10px; color: var(--ink-faint); }
.hint { font-size: 10px; color: var(--ink-faint); }
button { display: block; width: 100%; margin-top: 12px; padding: 14px 24px; background: var(--ink); color: var(--bg); font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; border: none; border-radius: var(--radius); cursor: pointer; transition: background 0.2s, transform 0.1s; }
button:hover:not(:disabled) { background: var(--accent); }
button:active:not(:disabled) { transform: scale(0.99); }
button:disabled { opacity: 0.45; cursor: default; }
.divider { display: flex; align-items: center; gap: 12px; margin: 32px 0; }
.divider-line { flex: 1; height: 1px; background: var(--border); }
.divider-label { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink-faint); }
.answer-section { display: none; animation: fadeUp 0.5s ease both; }
.answer-section.visible { display: block; }
.answer-box { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: var(--radius); padding: 20px 22px; }
.answer-meta { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
.answer-text { font-size: 14px; line-height: 1.85; color: var(--ink); white-space: pre-wrap; word-break: break-word; }
.thinking { display: flex; align-items: center; gap: 6px; padding: 4px 0; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s infinite; }
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes pulse { 0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } }
footer { margin-top: 64px; text-align: center; font-size: 10px; color: var(--ink-faint); letter-spacing: 0.1em; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Powered by Gemini AI</p>
    <h1>Ask me <em>anything</em></h1>
    <p class="tagline">Type a question below — an answer appears on this page</p>
  </header>
  <div class="input-section">
    <label class="field-label" for="question">Your question</label>
    <div class="input-wrap">
      <textarea id="question" placeholder="What would you like to know?" maxlength="1000" rows="4"></textarea>
      <div class="input-footer">
        <span class="char-count" id="char-count">0 / 1000</span>
        <span class="hint">Enter to submit · Shift+Enter for new line</span>
      </div>
    </div>
    <button id="ask-btn" onclick="ask()">Ask →</button>
  </div>
  <div class="divider">
    <div class="divider-line"></div>
    <span class="divider-label">Answer</span>
    <div class="divider-line"></div>
  </div>
  <div class="answer-section" id="answer-section">
    <div class="answer-box">
      <div class="answer-meta" id="answer-meta">Gemini</div>
      <div class="answer-text" id="answer-text"></div>
    </div>
  </div>
  <footer>Built with Gemini · Hosted on Cloudflare Pages</footer>
</div>
<script>
const WORKER_URL = 'https://gemini-worker.mikekoga.workers.dev';


const ta = document.getElementById('question');
const charCount = document.getElementById('char-count');
const btn = document.getElementById('ask-btn');
const section = document.getElementById('answer-section');
const metaEl = document.getElementById('answer-meta');
const textEl = document.getElementById('answer-text');

ta.addEventListener('input', () => { charCount.textContent = ta.value.length + ' / 1000'; });
ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); } });

async function ask() {
  const q = ta.value.trim();
  if (!q) return;
  btn.disabled = true;
  btn.textContent = 'Thinking...';
  section.classList.add('visible');
  metaEl.textContent = 'Gemini';
  textEl.innerHTML = '<div class="thinking"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: [{ parts: [{ text: q }] }] }),
    });
    const data = await res.json();
    const answer = data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response.';
    textEl.textContent = answer;
    metaEl.textContent = 'Gemini — ' + new Date().toLocaleTimeString();
  } catch (err) {
    textEl.textContent = 'Error: ' + err.message;
    metaEl.textContent = 'Error';
  }
  btn.disabled = false;
  btn.textContent = 'Ask →';
}
</script>
</body>
</html>
